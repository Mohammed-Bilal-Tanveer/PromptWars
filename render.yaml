services:
  - type: web
    name: lablink-api
    runtime: python
    rootDir: backend
    plan: starter
    region: singapore
    # Commands run INSIDE backend/ (rootDir), so no "cd backend" and no "backend/" prefix.
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: APP_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: lablink-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TIMEOUT_SECONDS
        value: "25"
      - key: CAMPUS_TIMEZONE
        value: Asia/Kolkata
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DEMO_MODE
        value: "true"

databases:
  - name: lablink-db
    databaseName: lablink
    user: lablink
    plan: basic-256mb
    region: singapore
